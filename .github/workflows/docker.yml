name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The jobs that push raise `packages: write` for
# themselves, and every push step is tag-gated, so a pull-request build cannot
# publish an image.
permissions:
  contents: read

jobs:
  # One job per architecture, each on its own native runner: compiling the
  # workspace under QEMU is many times slower. A tag pushes `<version>-amd64`
  # and `<version>-arm64`; the `manifest` job merges the pair into the tag an
  # operator pulls.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Loaded into the runner's daemon rather than pushed, so the scan below
      # sees the image before anything is published. The GitHub Actions cache
      # keeps the cargo-chef dependency layer between runs, per architecture.
      # A release rebuilds the runtime stage uncached, so its `apt-get upgrade`
      # always applies the security fixes Debian has shipped since the layer was
      # last built; pull requests keep it cached.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: nvisy-server:${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
          no-cache-filters: ${{ startsWith(github.ref, 'refs/tags/v') && 'runtime' || '' }}

      # Scanned on pull requests too, so a vulnerable dependency surfaces on the
      # change that introduces it.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nvisy-server:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the architecture-suffixed tag is written here, so the plain
      # `<version>` tag appears only once both architectures exist. The
      # suffixed tags are kept: the manifest refers to their digests.
      - name: Tag and push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/server
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          docker tag "nvisy-server:${{ github.sha }}" "$IMAGE:$version-${{ matrix.arch }}"
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  # Merges the per-architecture images into `<version>`, so `docker pull`
  # resolves to the host's architecture. Needs both builds, so a tag never
  # appears half-published.
  #
  # A release moves `latest`; a prerelease (a SemVer `-`, as in v0.1.0-rc.1)
  # publishes its version tag only, so it never becomes the image someone gets
  # by default.
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the per-architecture images
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/server
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          case "$version" in
            *-*) echo "$version is a prerelease; leaving :latest alone." ;;
            *) tags="$tags latest" ;;
          esac
          for tag in $tags; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$version"
