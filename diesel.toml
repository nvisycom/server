# https://diesel.rs/guides/configuring-diesel-cli

[print_schema]
file = "./crates/nvisy-postgres/src/schema.rs"
import_types = ["diesel::sql_types::*"]
custom_type_derives = ["diesel::query_builder::QueryId"]

[migrations_directory]
# The single source of truth for migrations. `embed_migrations!` in
# nvisy-postgres reads this same directory (via "../../migrations").
dir = "./migrations"
