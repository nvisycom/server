# Dev engine configuration: NER only.
#
# Point the server at this file with ENGINE_CONFIG_FILEPATH to run the GLiNER2
# NER recognizer from the `ner` compose profile. The server runs on the host
# (`make run`), so it reaches the service at the published host port, not the
# compose hostname. See docker/engine.example.toml for the full lineup (LLM,
# OCR, STT).

# GLiNER2 schema-driven NER/PII. Served by the `ner` service in
# docker/compose.yaml (profile `ner`), published on host port 3100.
[[recognizers.ner]]
name = "gliner2-ner"
kind = "bento"
base_url = "http://localhost:3100"
model = "fastino/gliner2-privacy-filter-PII-multi"
