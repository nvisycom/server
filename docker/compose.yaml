name: nvisy-dev

# Shared config for the inference services (NER, OCR, STT). Each is published on
# a loopback host port in the 32xx range — not the service's own 3000, and not
# the 31xx a standalone elide-runtime stack uses — so the two can coexist. The
# images carry no model weights: a one-shot `*-init` warmer downloads the model
# into a shared cache (as root, then hands it to the service uid) and exits; the
# service gates on it, then runs non-root with the cache read-only and the Hub
# offline, so request text never leaves the network. All three sit behind
# profiles, so `make run` skips them; `make run NER=1` brings them up.
x-inference: &inference
  restart: unless-stopped
  networks:
    - nvisy-dev

# The bentoml images ship no curl/wget, so readiness is probed with the
# `elide_core.readyz` module shipped in every image (rc.4+). The model loads in
# __init__, so readiness lags liveness; the start_period covers a cold load
# without flapping.
x-readyz: &readyz
  test: ["CMD", "python", "-m", "elide_core.readyz"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  postgres:
    image: postgres:18
    container_name: nvisy-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  nats:
    image: nats:2.14.2-alpine
    container_name: nvisy-nats-dev
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nvisy-dev

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: nvisy-rustfs-dev
    restart: unless-stopped
    # Bound to loopback: the host-run server reaches RustFS at localhost:9000,
    # but it is never exposed on the LAN (dev uses the well-known credentials).
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    # /health/ready (not /health) confirms storage is initialized, so bucket
    # init only runs once RustFS can actually serve requests.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  # Creates the first-party bucket once RustFS is up (RustFS does not
  # auto-create buckets). Exits after provisioning; safe to re-run.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    container_name: nvisy-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    # Configuration is passed through the environment and consumed by the
    # mounted script, so a credential containing shell metacharacters cannot
    # alter the command.
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-nvisy-dev}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./rustfs/init.sh:/init.sh:ro
    networks:
      - nvisy-dev

  # GLiNER2 schema-driven NER/PII. The host-run server reaches it at
  # localhost:3200 (ELIDE_NER_PORT); point the engine config's NER recognizer
  # there.
  ner-init:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-ner-init-dev
    profiles: ["ner"]
    user: root
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      ELIDE_BENTO_NER_MODEL: ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
    entrypoint: ["python", "-m", "elide_ner.warm"]
    volumes:
      - hf_cache:/cache/huggingface
    networks:
      - nvisy-dev

  ner:
    <<: *inference
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-ner-dev
    profiles: ["ner"]
    ports:
      - "127.0.0.1:${ELIDE_NER_PORT:-3200}:3000"
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ELIDE_BENTO_NER_MODEL: ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
      ELIDE_BENTO_NER_QUANTIZE: ${ELIDE_NER_QUANTIZE:-}
      ELIDE_BENTO_NER_MAX_TOKENS: ${ELIDE_NER_MAX_TOKENS:-512}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    healthcheck: *readyz
    depends_on:
      ner-init:
        condition: service_completed_successfully

  # docTR OCR (image modality). Reached at localhost:3201 (ELIDE_OCR_PORT).
  # docTR uses its own cache, not the Hugging Face Hub.
  ocr-init:
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-ocr-init-dev
    profiles: ["ocr"]
    user: root
    environment:
      DOCTR_CACHE_DIR: /cache/doctr
      ELIDE_BENTO_MODEL_NAME: ${ELIDE_OCR_MODEL:-db_resnet50+crnn_vgg16_bn}
    entrypoint: ["python", "-m", "elide_ocr.warm"]
    volumes:
      - doctr_cache:/cache/doctr
    networks:
      - nvisy-dev

  ocr:
    <<: *inference
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-ocr-dev
    profiles: ["ocr"]
    ports:
      - "127.0.0.1:${ELIDE_OCR_PORT:-3201}:3000"
    environment:
      DOCTR_CACHE_DIR: /cache/doctr
      # Present and non-empty wins over the model id; an operator mounts weights
      # over /models to override.
      ELIDE_BENTO_MODEL_PATH: /models
      ELIDE_BENTO_MODEL_NAME: ${ELIDE_OCR_MODEL:-db_resnet50+crnn_vgg16_bn}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - doctr_cache:/cache/doctr:ro
    healthcheck: *readyz
    depends_on:
      ocr-init:
        condition: service_completed_successfully

  # faster-whisper speech-to-text (audio modality). Reached at localhost:3202
  # (ELIDE_STT_PORT). Diarization is off by default (its model is gated on the
  # Hub); enable it with ELIDE_STT_DIARIZE=true and an ELIDE_STT_HF_TOKEN.
  stt-init:
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-stt-init-dev
    profiles: ["stt"]
    user: root
    environment:
      HF_HOME: /cache/huggingface
      ELIDE_BENTO_MODEL_NAME: ${ELIDE_STT_MODEL:-large-v3-turbo}
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
    entrypoint: ["python", "-m", "elide_stt.warm"]
    volumes:
      - hf_cache:/cache/huggingface
    networks:
      - nvisy-dev

  stt:
    <<: *inference
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.6}
    container_name: nvisy-stt-dev
    profiles: ["stt"]
    ports:
      - "127.0.0.1:${ELIDE_STT_PORT:-3202}:3000"
    environment:
      HF_HOME: /cache/huggingface
      ELIDE_BENTO_MODEL_PATH: /models
      ELIDE_BENTO_MODEL_NAME: ${ELIDE_STT_MODEL:-large-v3-turbo}
      ELIDE_BENTO_STT_DEVICE: ${ELIDE_STT_DEVICE:-cpu}
      ELIDE_BENTO_STT_COMPUTE_TYPE: ${ELIDE_STT_COMPUTE_TYPE:-}
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    # Transcription is long-running (up to 900s per request), so the probe gets
    # a longer timeout than the other two.
    healthcheck:
      <<: *readyz
      timeout: 10s
    depends_on:
      stt-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  nats_data:
  rustfs_data:
  # Hugging Face cache for NER and STT; docTR keeps its own. The init containers
  # populate them and the services mount them read-only, so model weights stay
  # out of the images and off repeat pulls.
  hf_cache:
  doctr_cache:

networks:
  nvisy-dev:
    driver: bridge
