name: nvisy-dev

services:
  postgres:
    image: postgres:18
    container_name: nvisy-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  nats:
    image: nats:2.14.2-alpine
    container_name: nvisy-nats-dev
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nvisy-dev

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: nvisy-rustfs-dev
    restart: unless-stopped
    # Bound to loopback: the host-run server reaches RustFS at localhost:9000,
    # but it is never exposed on the LAN (dev uses the well-known credentials).
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    # /health/ready (not /health) confirms storage is initialized, so bucket
    # init only runs once RustFS can actually serve requests.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  # Creates the first-party bucket once RustFS is up (RustFS does not
  # auto-create buckets). Exits after provisioning; safe to re-run.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    container_name: nvisy-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    # Configuration is passed through the environment and consumed by the
    # mounted script, so a credential containing shell metacharacters cannot
    # alter the command.
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-nvisy-dev}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./rustfs/init.sh:/init.sh:ro
    networks:
      - nvisy-dev

  # Warms the NER model into the shared Hugging Face cache and exits. The
  # elide-ner image carries no weights, so this one-shot `elide_ner.warm` run
  # downloads them first (as root, to populate the fresh named volume, which it
  # hands to the uid the service runs as); the service gates on it completing.
  # Not started by `make run`'s default set — bring NER up with the `ner`
  # profile (`make run-ner`).
  ner-init:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.4}
    container_name: nvisy-ner-init-dev
    profiles: ["ner"]
    # The warmer is the one process that must reach the Hub; the service then
    # runs offline against the cache it leaves behind.
    user: root
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      ELIDE_BENTO_NER_MODEL: ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
    entrypoint: ["python", "-m", "elide_ner.warm"]
    volumes:
      - hf_cache:/cache/huggingface
    networks:
      - nvisy-dev

  # GLiNER2 schema-driven NER/PII service. The host-run server reaches it at
  # localhost:3100 (ELIDE_NER_PORT); point the engine config's NER recognizer
  # there. The service runs as a non-root uid with the cache read-only and
  # HF_HUB_OFFLINE on, so request text never reaches the Hub.
  ner:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.4}
    container_name: nvisy-ner-dev
    profiles: ["ner"]
    restart: unless-stopped
    ports:
      - "${ELIDE_NER_PORT:-3100}:3000"
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ELIDE_BENTO_NER_MODEL: ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
      ELIDE_BENTO_NER_QUANTIZE: ${ELIDE_NER_QUANTIZE:-}
      ELIDE_BENTO_NER_MAX_TOKENS: ${ELIDE_NER_MAX_TOKENS:-512}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    # The bentoml image ships no curl/wget, so /readyz is probed with Python.
    # The model loads in __init__, so readiness lags liveness; the long
    # start_period covers a cold load without flapping.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/readyz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      ner-init:
        condition: service_completed_successfully
    networks:
      - nvisy-dev

volumes:
  postgres_data:
  nats_data:
  rustfs_data:
  # Hugging Face cache the NER init container populates and the service mounts
  # read-only; keeps the model weights out of the image and off repeat pulls.
  hf_cache:

networks:
  nvisy-dev:
    driver: bridge
