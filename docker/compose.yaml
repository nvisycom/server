name: nvisy-dev

# The inference services (NER, OCR, STT) come from compose.inference.yaml, each
# published on a loopback host port in the 32xx range — not the service's own
# 3000, and not the 31xx a standalone elide-runtime stack uses — so the two can
# coexist. All three sit behind profiles, so `make run` skips them; `make run
# NER=1` brings them up.

services:
  postgres:
    image: postgres:18
    container_name: nvisy-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  nats:
    image: nats:2.14.2-alpine
    container_name: nvisy-nats-dev
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nvisy-dev

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: nvisy-rustfs-dev
    restart: unless-stopped
    # Bound to loopback: the host-run server reaches RustFS at localhost:9000,
    # but it is never exposed on the LAN (dev uses the well-known credentials).
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    # /health/ready (not /health) confirms storage is initialized, so bucket
    # init only runs once RustFS can actually serve requests.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  # Creates the first-party bucket once RustFS is up (RustFS does not
  # auto-create buckets). Exits after provisioning; safe to re-run.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    container_name: nvisy-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    # Configuration is passed through the environment and consumed by the
    # mounted script, so a credential containing shell metacharacters cannot
    # alter the command.
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-nvisy-dev}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./rustfs/init.sh:/init.sh:ro
    networks:
      - nvisy-dev

  # Inference services, from compose.inference.yaml (profiles ner, ocr, stt),
  # reached by the host-run server at localhost:3200, 3201 and 3202.
  ner-init:
    extends:
      file: compose.inference.yaml
      service: ner-init
    container_name: nvisy-ner-init-dev
    networks:
      - nvisy-dev

  ner:
    extends:
      file: compose.inference.yaml
      service: ner
    container_name: nvisy-ner-dev
    ports:
      - "127.0.0.1:${ELIDE_NER_PORT:-3200}:3000"
    networks:
      - nvisy-dev
    depends_on:
      ner-init:
        condition: service_completed_successfully

  ocr-init:
    extends:
      file: compose.inference.yaml
      service: ocr-init
    container_name: nvisy-ocr-init-dev
    networks:
      - nvisy-dev

  ocr:
    extends:
      file: compose.inference.yaml
      service: ocr
    container_name: nvisy-ocr-dev
    ports:
      - "127.0.0.1:${ELIDE_OCR_PORT:-3201}:3000"
    networks:
      - nvisy-dev
    depends_on:
      ocr-init:
        condition: service_completed_successfully

  stt-init:
    extends:
      file: compose.inference.yaml
      service: stt-init
    container_name: nvisy-stt-init-dev
    networks:
      - nvisy-dev

  stt:
    extends:
      file: compose.inference.yaml
      service: stt
    container_name: nvisy-stt-dev
    ports:
      - "127.0.0.1:${ELIDE_STT_PORT:-3202}:3000"
    networks:
      - nvisy-dev
    depends_on:
      stt-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  nats_data:
  rustfs_data:
  # One model cache per inference service, populated by its init container and
  # mounted read-only by the service, so model weights stay out of the images and
  # off repeat pulls.
  ner_cache:
  ocr_cache:
  stt_cache:

networks:
  nvisy-dev:
    driver: bridge
