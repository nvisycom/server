name: nvisy-dev

services:
  postgres:
    image: postgres:18
    container_name: nvisy-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  nats:
    image: nats:2.14.2-alpine
    container_name: nvisy-nats-dev
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      - nats_data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nvisy-dev

  rustfs:
    image: rustfs/rustfs:latest
    container_name: nvisy-rustfs-dev
    restart: unless-stopped
    # Bound to loopback: the host-run server reaches RustFS at localhost:9000,
    # but it is never exposed on the LAN (dev uses the well-known credentials).
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy-dev

  # Creates the first-party bucket once RustFS is up (RustFS does not
  # auto-create buckets). Exits after provisioning; safe to re-run.
  rustfs-init:
    image: rustfs/rc:latest
    container_name: nvisy-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rc alias set nvisy http://rustfs:9000 ${S3_ACCESS_KEY_ID:-rustfsadmin} ${S3_SECRET_ACCESS_KEY:-rustfsadmin} &&
      rc bucket create --ignore-existing nvisy/${S3_BUCKET:-nvisy-dev}
      "
    networks:
      - nvisy-dev

volumes:
  postgres_data:
  nats_data:
  rustfs_data:

networks:
  nvisy-dev:
    driver: bridge
