# The inference services (NER, OCR, STT), shared by compose.yaml (development)
# and compose.prod.yaml (production). Each stack pulls them in with `extends` and
# adds what differs: its network, container names, the gate on each service's
# warmer, and, in development, a loopback port. The definitions mirror
# elide-runtime's own compose file for the version below; bump ELIDE_VERSION's
# default and re-check them against that release together.
#
# The images carry no model weights. Each service has a one-shot `*-init`
# warmer, running the service's own image, that downloads the model into a
# shared cache (as root, then hands it to the service uid) and exits; the
# service gates on it, then runs non-root with the cache read-only and the Hub
# offline, so request text never leaves the network. All sit behind profiles
# (`ner`, `ocr`, `stt`), so a stack starts them only when asked.

# The images ship no curl/wget, so readiness is probed with the module every
# image includes. /readyz answers only once the model has loaded; 60s is a wide
# margin over the measured cold loads (NER about 10s, OCR and STT under 10s).
x-readyz: &readyz
  test: ["CMD", "python", "-m", "elide_core.readyz"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

# Each model id reaches both a service and its warmer from one variable, so the
# warm cannot drift from what the service loads. The OCR recognizer is a Hub
# model pinned to a commit, which the service requires.
x-ner-model: &ner-model ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
x-ocr-detection: &ocr-detection ${ELIDE_OCR_DETECTION:-db_resnet50}
x-ocr-recognition: &ocr-recognition ${ELIDE_OCR_RECOGNITION:-Felix92/onnxtr-parseq-multilingual-v1@7d7329948dbcff02637a3eb9c14ae0c4440c5ed0}
x-stt-model: &stt-model ${ELIDE_STT_MODEL:-large-v3-turbo}

services:
  # GLiNER2 NER (text modality): names, organizations, and the other entity
  # labels pattern matching cannot find.
  ner-init:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["ner"]
    user: root
    environment:
      HF_HOME: /cache/huggingface
      # The image bakes the Hub offline for the service; the warmer is the one
      # container that must reach it.
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      ELIDE_BENTO_NER_MODEL: *ner-model
    entrypoint: ["python", "-m", "elide_ner.warm"]
    volumes:
      - hf_cache:/cache/huggingface

  ner:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["ner"]
    restart: unless-stopped
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ELIDE_BENTO_NER_MODEL: *ner-model
      ELIDE_BENTO_NER_QUANTIZE: ${ELIDE_NER_QUANTIZE:-}
      ELIDE_BENTO_NER_MAX_TOKENS: ${ELIDE_NER_MAX_TOKENS:-512}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    healthcheck: *readyz

  # OnnxTR OCR (image modality and scanned pages). Its cache holds both OnnxTR's
  # own (built-in architectures) and a Hugging Face cache (Hub models), in its
  # own volume, so its warmer never writes where another service reads.
  ocr-init:
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["ocr"]
    user: root
    environment:
      ONNXTR_CACHE_DIR: /cache/onnxtr
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "0"
      ELIDE_BENTO_OCR_DETECTION: *ocr-detection
      ELIDE_BENTO_OCR_RECOGNITION: *ocr-recognition
    entrypoint: ["python", "-m", "elide_ocr.warm"]
    volumes:
      - ocr_cache:/cache

  ocr:
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["ocr"]
    restart: unless-stopped
    environment:
      ONNXTR_CACHE_DIR: /cache/onnxtr
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      ELIDE_BENTO_OCR_DETECTION: *ocr-detection
      ELIDE_BENTO_OCR_RECOGNITION: *ocr-recognition
      ELIDE_BENTO_OCR_DEVICE: ${ELIDE_OCR_DEVICE:-cpu}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - ocr_cache:/cache:ro
    healthcheck: *readyz

  # faster-whisper speech-to-text (audio modality). Diarization is off by
  # default (its model is gated on the Hub); enable it with ELIDE_STT_DIARIZE=true
  # and an ELIDE_STT_HF_TOKEN.
  stt-init:
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["stt"]
    user: root
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "0"
      ELIDE_BENTO_STT_MODEL: *stt-model
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
    entrypoint: ["python", "-m", "elide_stt.warm"]
    volumes:
      - hf_cache:/cache/huggingface

  stt:
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.7}
    profiles: ["stt"]
    restart: unless-stopped
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      ELIDE_BENTO_STT_MODEL: *stt-model
      ELIDE_BENTO_STT_DEVICE: ${ELIDE_STT_DEVICE:-cpu}
      ELIDE_BENTO_STT_COMPUTE_TYPE: ${ELIDE_STT_COMPUTE_TYPE:-}
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    # Transcription is long-running (the service allows a 900s request), so the
    # probe gets a longer timeout than the other two.
    healthcheck:
      <<: *readyz
      timeout: 10s

volumes:
  hf_cache:
  ocr_cache:
