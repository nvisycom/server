name: nvisy

# The inference services (NER, OCR, STT) come from compose.inference.yaml. They
# sit behind profiles — start them with `--profile ner --profile ocr --profile
# stt` (any subset) — and are reachable only on the private network, at the URLs
# engine.example.toml uses.
services:
  postgres:
    image: postgres:18
    container_name: nvisy-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nvisy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nvisy}
    volumes:
      # PostgreSQL 18 keeps its data under a versioned directory below
      # /var/lib/postgresql, so the volume mounts the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER:-nvisy} -d ${POSTGRES_DB:-nvisy}",
      ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy

  nats:
    image: nats:2.14.2-alpine
    container_name: nvisy-nats
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    # Clients authenticate with NATS_TOKEN; the server presents the same token.
    command:
      - "-c"
      - "/etc/nats/nats.conf"
      - "--auth"
      - "${NATS_TOKEN:?NATS_TOKEN is required}"
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nvisy

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: nvisy-rustfs
    restart: unless-stopped
    # No host ports: the server reaches RustFS over the internal network at
    # http://rustfs:9000. Expose the console deliberately (an SSH tunnel or a
    # temporary compose override) rather than publishing it by default.
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    # /health/ready (not /health) confirms storage is initialized, so bucket
    # init only runs once RustFS can actually serve requests.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nvisy

  # Creates the first-party bucket once RustFS is up (RustFS does not
  # auto-create buckets). Exits after provisioning; safe to re-run.
  rustfs-init:
    image: rustfs/rc:v0.1.31
    container_name: nvisy-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    # Configuration is passed through the environment and consumed by the
    # mounted script, so a credential containing shell metacharacters cannot
    # alter the command.
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-nvisy}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./rustfs/init.sh:/init.sh:ro
    networks:
      - nvisy

  # Inference services, from compose.inference.yaml (profiles ner, ocr, stt).
  ner-init:
    extends:
      file: compose.inference.yaml
      service: ner-init
    container_name: nvisy-ner-init
    networks:
      - nvisy

  ner:
    extends:
      file: compose.inference.yaml
      service: ner
    container_name: nvisy-ner
    networks:
      - nvisy
    depends_on:
      ner-init:
        condition: service_completed_successfully

  ocr-init:
    extends:
      file: compose.inference.yaml
      service: ocr-init
    container_name: nvisy-ocr-init
    networks:
      - nvisy

  ocr:
    extends:
      file: compose.inference.yaml
      service: ocr
    container_name: nvisy-ocr
    networks:
      - nvisy
    depends_on:
      ocr-init:
        condition: service_completed_successfully

  stt-init:
    extends:
      file: compose.inference.yaml
      service: stt-init
    container_name: nvisy-stt-init
    networks:
      - nvisy

  stt:
    extends:
      file: compose.inference.yaml
      service: stt
    container_name: nvisy-stt
    networks:
      - nvisy
    depends_on:
      stt-init:
        condition: service_completed_successfully

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # VERSION names a published release to pull from ghcr.io (pin it; there is
    # no `latest` while releases are prereleases), or any local tag together
    # with `--build` to build this checkout.
    image: ghcr.io/nvisycom/server:${VERSION:?set VERSION to a published release, or a local tag with --build}
    container_name: nvisy-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nvisy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nvisy}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:?NATS_TOKEN is required}
      S3_BUCKET: ${S3_BUCKET:-nvisy}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://rustfs:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AUTH_PUBLIC_PEM_FILEPATH: ${AUTH_PUBLIC_PEM_FILEPATH:-/etc/nvisy/public.pem}
      AUTH_PRIVATE_PEM_FILEPATH: ${AUTH_PRIVATE_PEM_FILEPATH:-/etc/nvisy/private.pem}
      ENCRYPTION_KEY_FILEPATH: ${ENCRYPTION_KEY_FILEPATH:-/etc/nvisy/encryption.key}
      ENGINE_CONFIG_FILEPATH: ${ENGINE_CONFIG_FILEPATH:-/etc/nvisy/engine.toml}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-1h}
      HEALTH_CACHE_DURATION: ${HEALTH_CACHE_DURATION:-30s}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    # The auth key pair, the encryption key, and engine.toml. The image runs as
    # uid 1000, which must be able to read every file here.
    volumes:
      - ${NVISY_CONFIG_DIR:-./config}:/etc/nvisy:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      # Started only with their profiles; when they are, the server waits for
      # them to be ready.
      ner:
        condition: service_healthy
        required: false
      ocr:
        condition: service_healthy
        required: false
      stt:
        condition: service_healthy
        required: false
    networks:
      - nvisy

volumes:
  postgres_data:
  nats_data:
  rustfs_data:
  # Model caches, populated by the init containers and mounted read-only by the
  # services, so weights stay out of the images and off repeat pulls.
  hf_cache:
  doctr_cache:

networks:
  nvisy:
    driver: bridge
