# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-cli"
description = "Command-line interface and HTTP server for the Nvisy platform"
readme = "./README.md"
keywords = ["cli", "server", "http", "nvisy", "document"]
categories = ["command-line-utilities", "web-programming::http-server"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# TLS support: enables HTTPS with rustls for secure connections
tls = ["axum-server"]

# OpenTelemetry support: enables environment-based log filtering
otel = ["tracing-subscriber/env-filter"]

# Dotenv support: loads environment variables from .env files
# This allows configuration via .env files in addition to CLI args
dotenv = ["dep:dotenvy"]

[dependencies]
# Internal crates
nvisy-nats = { workspace = true, features = ["cli"] }
nvisy-postgres = { workspace = true, features = ["cli"] }
nvisy-webhook = { workspace = true, features = ["reqwest", "cli"] }
nvisy-server = { workspace = true, features = ["cli"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }
humantime = { workspace = true, features = [] }
dotenvy = { workspace = true, features = [], optional = true }

# HTTP server & middleware
axum = { workspace = true, features = ["http2", "macros"] }
axum-server = { workspace = true, features = ["tls-rustls"], optional = true }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "json", "env-filter"] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }

# Derive macros & utilities
anyhow = { workspace = true, features = ["backtrace"] }
