# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-nats"
description = "Task-focused NATS client for the Nvisy platform with comprehensive JetStream support"
readme = "./README.md"
keywords = ["nats", "messaging", "jetstream", "pubsub", "streaming"]
categories = ["network-programming", "api-bindings"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# CLI support: derives clap::Args on config structs so the binary can parse them
# from flags/env directly, keeping the dependency optional for library users.
cli = ["dep:clap", "nvisy-core/cli"]

# Test support: an ephemeral NATS (JetStream) container + connected client, for
# this crate's tests and for downstream crates that compose a real server.
test_util = ["dep:testcontainers-modules", "nvisy-core/test_util"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# CLI
clap = { workspace = true, features = ["derive", "env"], optional = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true, features = [] }
async-trait = { workspace = true, features = [] }

# Messaging (NATS)
async-nats = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# Testing utilities
testcontainers-modules = { workspace = true, features = ["nats"], optional = true }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = [
    "deref",
    "deref_mut",
    "from",
    "into",
    "display",
    "from_str",
] }

[lints]
workspace = true
