[package]
name = "nvisy-inference"
description = "LLM inference providers (OpenAI, Ollama, Anthropic) for Nvisy"
readme = "./README.md"
keywords = ["nvisy", "llm", "openai", "ollama", "anthropic"]
categories = ["api-bindings"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
schema = ["dep:schemars"]

[dependencies]
# Async runtime
futures = { workspace = true, features = [] }
async-stream = { workspace = true, features = [] }

# LLM framework: provider clients + the classic Agent runtime
rig = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = [], optional = true }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["deref"] }

[dev-dependencies]
serde_json = { workspace = true, features = [] }
tokio = { workspace = true, features = ["macros", "rt"] }
