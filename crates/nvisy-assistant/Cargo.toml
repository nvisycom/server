[package]
name = "nvisy-assistant"
description = "LLM assistant engine and providers (OpenAI, Ollama, Anthropic) for Nvisy"
readme = "./README.md"
keywords = ["nvisy", "assistant", "llm", "openai", "anthropic"]
categories = ["api-bindings"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
schema = ["dep:schemars", "nvisy-core/schema"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# LLM framework
rig = { workspace = true, features = ["reqwest"] }

# OpenAPI/Documentation
schemars = { workspace = true, features = [], optional = true }

# Observability
tracing = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }

[dev-dependencies]
# Async runtime
tokio = { workspace = true, features = ["macros", "rt"] }

# (De)serialization
serde_json = { workspace = true, features = [] }

[lints]
workspace = true
