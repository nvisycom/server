# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-server"
description = "High-performance HTTP API server for the Nvisy document redaction platform"
readme = "./README.md"
keywords = ["http", "server", "api", "web", "axum"]
categories = ["web-programming::http-server"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# CLI support: derives clap::Args on config structs so the binary can parse them
# from flags/env directly, keeping the dependency optional for library users.
cli = ["dep:clap", "dep:humantime"]

[dependencies]
# Elide crates. The workspace dep disables default features, so re-enable every
# modality (all-modalities: tabular/image/audio/document) plus JSON/CSV audit
# export. elide-pipeline re-exports every engine type this crate uses.
elide-pipeline = { workspace = true, features = [
    "all-modalities",
    "audit-json",
    "audit-csv",
] }

# Internal crates
nvisy-core = { workspace = true, features = ["schema"] }
nvisy-nats = { workspace = true, features = [] }
nvisy-inference = { workspace = true, features = ["schema"] }
nvisy-object = { workspace = true, features = ["schema"] }
nvisy-postgres = { workspace = true, features = ["schema"] }
nvisy-webhook = { workspace = true, features = ["schema"] }

# Async runtime
tokio = { workspace = true, features = [] }
tokio-util = { workspace = true, features = ["io"] }
futures = { workspace = true, features = [] }
async-trait = { workspace = true, features = [] }
async-stream = { workspace = true, features = [] }
pin-project-lite = { workspace = true, features = [] }

# HTTP server & middleware
axum = { workspace = true, features = ["http2", "macros", "multipart"] }
axum-client-ip = { workspace = true, features = [] }
axum-extra = { workspace = true, features = ["typed-header", "attachment", "query"] }
tower = { workspace = true, features = [] }
tower-http = { workspace = true, features = [] }

# OpenAPI/Documentation
aide = { workspace = true, features = ["axum", "axum-query", "axum-extra-query", "axum-form", "axum-json", "axum-multipart", "axum-extra", "bytes", "http"] }
schemars = { workspace = true, features = [] }

# Authentication
jsonwebtoken = { workspace = true, features = [] }
argon2 = { workspace = true, features = [] }
zxcvbn = { workspace = true, features = [] }
sha2 = { workspace = true, features = [] }

# Encryption & Cryptography
chacha20poly1305 = { workspace = true, features = [] }
aead-stream = { workspace = true, features = ["alloc"] }
hkdf = { workspace = true, features = [] }

# Encoding
hex = { workspace = true, features = [] }
mime_guess = { workspace = true }

# Randomness
rand = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# CLI
clap = { workspace = true, features = ["derive", "env"], optional = true }
humantime = { workspace = true, features = [], optional = true }

# (De)serialization
csv = { workspace = true, features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
toml = { workspace = true, features = ["parse"] }
bytes = { workspace = true, features = [] }
http-body = { workspace = true, features = [] }
validator = { workspace = true, features = [] }

# Text processing
woothee = { workspace = true, features = [] }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["full"] }
strum = { workspace = true, features = ["derive"] }
anyhow = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
jiff = { workspace = true, features = ["serde"] }
ipnet = { workspace = true, features = [] }

# Image processing
image = { workspace = true }

# Archive reading & writing
zip = { workspace = true }

# Cron parsing
croner = { workspace = true, features = [] }
chrono = { workspace = true, features = [] }

# Domain datatypes & data structures
url = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
nvisy-nats = { workspace = true, features = [] }
nvisy-postgres = { workspace = true, features = ["schema"] }
nvisy-webhook = { workspace = true, features = ["reqwest"] }

axum-test = { workspace = true, features = [] }
anyhow = { workspace = true, features = ["backtrace"] }
tempfile = { workspace = true, features = [] }
dotenvy = { workspace = true, features = [] }
