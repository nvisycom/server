# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-server"
description = "High-performance HTTP API server for the Nvisy document redaction platform"
readme = "./README.md"
keywords = ["http", "server", "api", "web", "axum"]
categories = ["web-programming::http-server"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# CLI support: derives clap::Args on config structs so the binary can parse them
# from flags/env directly, keeping the dependency optional for library users.
cli = [
    "dep:clap",
    "nvisy-core/cli",
    "nvisy-s3/cli",
    "nvisy-postgres/cli",
    "nvisy-nats/cli",
    "nvisy-file-service/cli",
]

# Test support: the `TestApp` harness (containerized infra + a real ServiceState
# + a TestServer + authed actors), for this crate's handler tests and downstream
# crates that test their own routes.
test_util = [
    "nvisy-postgres/test_util",
    "nvisy-nats/test_util",
    "nvisy-s3/test_util",
    "nvisy-webhook/reqwest",
    "dep:axum-test",
]

[dependencies]
# Elide crates
elide-pipeline = { workspace = true, features = [
    "all-modalities",
    "audit-json",
    "audit-csv",
    "audit-zip",
] }

# Internal crates
nvisy-core = { workspace = true, features = ["schema", "oauth2"] }
nvisy-nats = { workspace = true, features = [] }
nvisy-assistant = { workspace = true, features = ["schema"] }
nvisy-object-store = { workspace = true, features = ["schema"] }
nvisy-file-service = { workspace = true, features = ["schema"] }
nvisy-postgres = { workspace = true, features = ["schema"] }
nvisy-s3 = { workspace = true, features = [] }
nvisy-webhook = { workspace = true, features = ["schema"] }

# CLI
clap = { workspace = true, features = ["derive", "env"], optional = true }

# Async runtime
tokio = { workspace = true, features = [] }
tokio-util = { workspace = true, features = ["io"] }
futures = { workspace = true, features = [] }
async-trait = { workspace = true, features = [] }
async-stream = { workspace = true, features = [] }

# HTTP client & middleware
reqwest = { workspace = true, features = [] }

# OAuth & OIDC
openidconnect = { workspace = true, features = [] }

# HTTP server & middleware
axum = { workspace = true, features = ["http2", "macros", "multipart"] }
axum-client-ip = { workspace = true, features = [] }
axum-extra = { workspace = true, features = ["typed-header", "attachment", "query", "cookie"] }
tower = { workspace = true, features = [] }
tower-http = { workspace = true, features = [] }
axum-test = { workspace = true, features = [], optional = true }

# OpenAPI/Documentation
aide = { workspace = true, features = ["axum", "axum-query", "axum-extra-query", "axum-form", "axum-json", "axum-multipart", "axum-extra", "bytes", "http"] }
schemars = { workspace = true, features = [] }
indexmap = { workspace = true, features = [] }

# Authentication
jsonwebtoken = { workspace = true, features = [] }
argon2 = { workspace = true, features = [] }
zxcvbn = { workspace = true, features = [] }

# Encryption & Cryptography
sha2 = { workspace = true, features = [] }
chacha20poly1305 = { workspace = true, features = [] }
aead-stream = { workspace = true, features = ["alloc"] }
hkdf = { workspace = true, features = [] }

# Encoding
base64 = { workspace = true, features = ["std"] }
hex = { workspace = true, features = [] }
mime_guess = { workspace = true, features = [] }

# Randomness
rand = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# (De)serialization
csv = { workspace = true, features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
garde = { workspace = true, features = [] }

# Text processing
woothee = { workspace = true, features = [] }

# Derive macros & utilities
pin-project-lite = { workspace = true, features = [] }
http-body = { workspace = true, features = [] }
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["full"] }
strum = { workspace = true, features = ["derive"] }
anyhow = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
jiff = { workspace = true, features = ["serde"] }
time = { workspace = true, features = [] }

# Image processing
image = { workspace = true, features = [] }

# Cron parsing
croner = { workspace = true, features = [] }
chrono = { workspace = true, features = [] }

# Domain datatypes & data structures
ipnet = { workspace = true, features = [] }
url = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
nvisy-nats = { workspace = true, features = [] }
nvisy-postgres = { workspace = true, features = ["schema", "test_util"] }
nvisy-webhook = { workspace = true, features = ["reqwest"] }

# CLI
dotenvy = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt"] }

# HTTP server & middleware
axum-test = { workspace = true, features = [] }

# Testing utilities
tempfile = { workspace = true, features = [] }

# Derive macros & utilities
anyhow = { workspace = true, features = ["backtrace"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
