[package]
name = "nvisy-s3"
description = "First-party S3-compatible blob storage (files, audits, avatars) for Nvisy"
readme = "./README.md"
keywords = ["nvisy", "s3", "object-storage", "storage"]
categories = ["filesystem"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Exposes the config type's `clap::Args` derive for the CLI binary.
cli = ["dep:clap"]

# Test support: an ephemeral RustFS container + a store with its bucket created,
# for this crate's tests and downstream crates that need a real S3.
test_util = ["dep:testcontainers-modules", "dep:reqwest", "nvisy-core/test_util"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true }
nvisy-object-store = { workspace = true }

# Async runtime & IO
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["io"] }
futures = { workspace = true, features = [] }
async-trait = { workspace = true }

# S3-compatible blob storage (AWS S3, RustFS, MinIO, R2)
object_store = { workspace = true, features = ["aws"] }

# HTTP client
reqwest = { workspace = true, features = [], optional = true }

# CLI configuration (optional; enabled by the server binary)
clap = { workspace = true, features = ["derive", "env"], optional = true }

# Test-only: an ephemeral S3-compatible container via testcontainers' generic
# image, with HTTP readiness probing (gated on the `test_util` feature).
testcontainers-modules = { workspace = true, features = ["http_wait"], optional = true }

# Observability
tracing = { workspace = true, features = [] }

# Errors
thiserror = { workspace = true, features = [] }

# Derive macros & utilities
strum = { workspace = true, features = ["derive"] }

# Primitive datatypes
url = { workspace = true, features = [] }
uuid = { workspace = true, features = ["v7"] }
base64 = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
