[package]
name = "nvisy-core"
description = "Shared foundation types for nvisy services"
readme = "./README.md"
keywords = ["nvisy", "base", "foundation"]
categories = ["rust-patterns"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# JSON Schema support: enables JsonSchema derives on core types
# This allows core types to be used directly in API documentation without
# manual schema implementations, while keeping the dependency optional
schema = ["dep:schemars"]

# CLI support: derives clap value/arg types on core config types and provides
# the duration parser config flags use.
cli = ["dep:clap", "dep:jiff"]

# Test support: the container-boot limiter shared by every test harness.
test_util = ["tokio/sync"]

# HTTP client support: the shared middleware stack, and the classification of
# reqwest failures into the shared error kinds.
reqwest = ["dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry", "dep:reqwest-tracing"]

# OAuth support: an `oauth2` HTTP transport over the shared middleware stack.
oauth2 = ["reqwest", "dep:oauth2", "dep:http"]

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"], optional = true }

# Async runtime
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["net"] }

# HTTP client & middleware
reqwest = { workspace = true, features = [], optional = true }
reqwest-middleware = { workspace = true, features = [], optional = true }
reqwest-retry = { workspace = true, features = [], optional = true }
reqwest-tracing = { workspace = true, features = [], optional = true }

# OAuth & OIDC
http = { workspace = true, features = [], optional = true }
oauth2 = { workspace = true, features = [], optional = true }

# OpenAPI/Documentation
schemars = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
jiff = { workspace = true, features = [], optional = true }

# Domain datatypes & data structures
url = { workspace = true, features = [] }

[dev-dependencies]
# Async runtime
tokio = { workspace = true, features = ["macros", "rt"] }

# (De)serialization
serde_json = { workspace = true, features = [] }

[lints]
workspace = true
